<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier dashboard — Stocklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-inner">
    <a href="index.html" class="brand"><span class="dot"></span>Stocklist</a>
    <div class="nav" id="topbar-nav"></div>
  </div>
</div>

<div class="wrap page-head">
  <div class="crumbs"><a href="index.html">Stocklist</a> / Supplier dashboard</div>
  <h1 id="greeting">Supplier dashboard</h1>
  <p id="subhead"></p>
</div>

<div class="wrap">
  <section class="grid-3" id="stat-row"></section>

  <section>
    <div class="panel-head" style="margin-bottom:14px;"><span class="panel-title">Incoming orders</span></div>
    <div id="order-list" class="stack" style="gap:12px;"></div>
  </section>

  <section>
    <div class="panel-head" style="margin-bottom:14px;"><span class="panel-title">Your products</span></div>
    <div class="panel">
      <div id="product-list" class="stack"></div>
      <hr class="divider">
      <form id="add-product-form" class="field-row" style="align-items:end;">
        <div class="field" style="margin-bottom:0;">
          <label for="p-name">Product name</label>
          <input id="p-name" required placeholder="Toilet paper, 2-ply">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="p-unit">Unit</label>
          <input id="p-unit" required placeholder="pack of 9">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="p-price">Price (R)</label>
          <input id="p-price" type="number" min="0" step="0.01" required placeholder="89.00">
        </div>
        <button class="btn" type="submit">Add product</button>
      </form>
    </div>
  </section>
</div>

<footer>
  <div class="wrap"><span class="stencil">Stocklist</span></div>
</footer>

<script src="assets/db.js"></script>
<script src="assets/nav.js"></script>
<script>
  const session = StocklistDB.getSession();
  if (!session || session.type !== "supplier") {
    window.location.href = "login.html";
  }
  const supplier = StocklistDB.getSupplier(session.id);
  document.getElementById("greeting").textContent = supplier.name;
  document.getElementById("subhead").textContent = supplier.city + " · " + supplier.categories.join(", ");

  const STATUS_FLOW = StocklistDB.STATUS_FLOW;
  const statusLabel = { placed: "Placed", confirmed: "Confirmed", packed: "Packed", out_for_delivery: "Out for delivery", delivered: "Delivered" };

  function render() {
    const orders = StocklistDB.listOrdersForSupplier(supplier.id);
    const revenue = orders.reduce((sum, o) => sum + o.total, 0);
    const commission = revenue * 0.10;
    const pending = orders.filter((o) => o.status !== "delivered").length;

    document.getElementById("stat-row").innerHTML = `
      <div class="panel stat"><div class="num">${orders.length}</div><div class="lbl">Total orders</div></div>
      <div class="panel stat"><div class="num">${pending}</div><div class="lbl">Pending fulfilment</div></div>
      <div class="panel stat"><div class="num">R${revenue.toFixed(0)}</div><div class="lbl">Revenue (commission ≈ R${commission.toFixed(0)})</div></div>
    `;

    const orderListEl = document.getElementById("order-list");
    if (orders.length === 0) {
      orderListEl.innerHTML = `<div class="empty-state"><span class="stencil">No orders yet</span>Orders placed against your catalogue will show up here.</div>`;
    } else {
      orderListEl.innerHTML = orders.map((o) => {
        const biz = StocklistDB.getBusiness(o.businessId);
        const idx = STATUS_FLOW.indexOf(o.status);
        const nextStatus = STATUS_FLOW[idx + 1];
        return `
          <div class="panel">
            <div class="flex-between">
              <div>
                <div style="font-weight:700;">${biz ? biz.businessName : "Unknown business"}</div>
                <span class="stencil dim">${new Date(o.createdAt).toLocaleDateString("en-ZA", { day: "2-digit", month: "short", year: "numeric" })} · ${o.items.length} ITEMS ${o.recurrence.enabled ? "· RECURRING" : ""}</span>
              </div>
              <div class="flex-between" style="gap:10px;">
                <span class="badge ${o.status === "delivered" ? "b-green" : "b-amber"}"><span class="pip"></span>${statusLabel[o.status]}</span>
                <span style="font-family:var(--font-display); font-size:1.1rem; font-weight:700;">R${o.total.toFixed(2)}</span>
              </div>
            </div>
            ${nextStatus ? `<div style="margin-top:12px;"><button class="btn small" data-advance="${o.id}">Mark as ${statusLabel[nextStatus]}</button></div>` : ""}
          </div>
        `;
      }).join("");
      document.querySelectorAll("[data-advance]").forEach((btn) => {
        btn.addEventListener("click", () => { StocklistDB.advanceOrderStatus(btn.dataset.advance); render(); });
      });
    }

    const products = StocklistDB.listProducts(supplier.id);
    document.getElementById("product-list").innerHTML = products.length
      ? products.map((p) => `<div class="line-item"><div><div class="name">${p.name}</div><div class="meta">${p.unit}</div></div><div>R${p.price.toFixed(2)}</div></div>`).join("")
      : `<p class="muted" style="font-size:.88rem;">No products listed yet — add your first one below.</p>`;
  }

  document.getElementById("add-product-form").addEventListener("submit", (e) => {
    e.preventDefault();
    StocklistDB.addProduct(supplier.id, {
      name: document.getElementById("p-name").value.trim(),
      unit: document.getElementById("p-unit").value.trim(),
      price: document.getElementById("p-price").value,
    });
    e.target.reset();
    render();
  });

  render();
</script>
</body>
</html>
