<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier dashboard — Stocklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#141b22; --ink-soft:#1c2530; --paper:#f2ede1; --orange:#e0590c;
    --green:#4c7a3d; --stamp-red:#a8362a; --amber:#c98a1f; --muted:#8b93a0; --line:#33404d;
    --display:'Oswald',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--paper); font-family:var(--body); min-height:100vh;}
  a{color:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding:50px 24px 100px;}
  h1{font-family:var(--display); font-weight:600; text-transform:uppercase; letter-spacing:0.01em; font-size:clamp(26px,4.5vw,38px);}
  .backlink{font-family:var(--mono); font-size:13px; color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:30px;}
  .backlink:hover{color:var(--paper);}
  .eyebrow{font-family:var(--mono); font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--orange); display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .eyebrow::before{content:""; width:22px; height:1px; background:var(--orange);}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:36px;}

  .filters{display:flex; gap:10px;}
  .filter-btn{font-family:var(--mono); font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; background:transparent; color:var(--muted); border:1px solid var(--line); padding:9px 16px; border-radius:20px; cursor:pointer;}
  .filter-btn.active{background:var(--orange); color:var(--ink); border-color:var(--orange);}

  .order-list{display:flex; flex-direction:column; gap:14px;}
  .order-card{background:var(--paper); color:var(--ink); border-radius:3px; padding:24px 26px; display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center;}
  @media (max-width:640px){ .order-card{grid-template-columns:1fr;} }
  .oc-top{display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px;}
  .oc-code{font-family:var(--mono); font-weight:600; font-size:14px; color:var(--stamp-red);}
  .oc-biz{font-family:var(--display); font-size:19px; text-transform:uppercase;}
  .oc-meta{font-family:var(--mono); font-size:12px; color:#6a6f76; margin-bottom:10px;}
  .oc-items{font-size:13.5px; color:#3f444a; white-space:pre-wrap; line-height:1.6; background:#fbf9f2; border:1px solid #e2d9be; border-radius:2px; padding:12px 14px;}
  .oc-actions{display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  @media (max-width:640px){ .oc-actions{align-items:flex-start; flex-direction:row;} }
  .status-badge{font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; padding:6px 12px; border-radius:20px;}
  .status-pending{background:#f3e6c9; color:#8a5c0f;}
  .status-completed{background:#e2ecdd; color:#33531f;}
  .toggle-btn{font-family:var(--mono); font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:2px; border:none; cursor:pointer; letter-spacing:0.03em;}
  .toggle-btn.to-complete{background:var(--green); color:#fff;}
  .toggle-btn.to-pending{background:transparent; color:#6a6f76; border:1px solid #cfc6ab;}

  .empty, .loading{font-family:var(--mono); color:var(--muted); font-size:14px; padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="stocklist.html">← Back to Stocklist</a>
  <div class="topbar">
    <div>
      <div class="eyebrow">Supplier dashboard</div>
      <h1>Incoming orders</h1>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
  </div>

  <div class="loading" id="loadingMsg">Loading orders…</div>
  <div class="empty" id="emptyMsg" style="display:none;">No orders yet.</div>
  <div class="order-list" id="orderList"></div>
</div>

<script>
  const SUPABASE_URL = "https://edmlbvaoxngyryuwkirq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_vzdFDXM-79Jylf-pZH1GDA_abjMIgl0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allOrders = [];
  let currentFilter = 'all';

  async function loadOrders(){
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    document.getElementById('loadingMsg').style.display = 'none';

    if(error){
      document.getElementById('emptyMsg').textContent = "Couldn't load orders: " + error.message;
      document.getElementById('emptyMsg').style.display = 'block';
      return;
    }

    allOrders = data || [];
    render();
  }

  function render(){
    const list = document.getElementById('orderList');
    const empty = document.getElementById('emptyMsg');
    list.innerHTML = '';

    const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

    if(filtered.length === 0){
      empty.textContent = 'No orders here yet.';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    filtered.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';

      const isCompleted = order.status === 'completed';

      card.innerHTML = `
        <div>
          <div class="oc-top">
            <span class="oc-code">${order.tracking_code}</span>
            <span class="oc-biz">${escapeHtml(order.business_name)}</span>
            <span class="status-badge ${isCompleted ? 'status-completed' : 'status-pending'}">${isCompleted ? 'Completed' : 'Pending'}</span>
          </div>
          <div class="oc-meta">${escapeHtml(order.business_type || '—')} · ${escapeHtml(order.city || '—')} · ${escapeHtml(order.contact || '—')} · ${new Date(order.created_at).toLocaleString()}</div>
          <div class="oc-items">${escapeHtml(order.items)}</div>
        </div>
        <div class="oc-actions">
          <button class="toggle-btn ${isCompleted ? 'to-pending' : 'to-complete'}" data-id="${order.id}" data-newstatus="${isCompleted ? 'pending' : 'completed'}">
            ${isCompleted ? 'Mark pending' : 'Mark completed'}
          </button>
        </div>
      `;
      list.appendChild(card);
    });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Updating…';
        const { error } = await supabase
          .from('orders')
          .update({ status: btn.dataset.newstatus })
          .eq('id', btn.dataset.id);
        if(!error){
          await loadOrders();
        } else {
          btn.disabled = false;
          alert('Could not update order: ' + error.message);
        }
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  loadOrders();
</script>
</body>
</html>
