<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your order — Stocklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#141b22; --ink-soft:#1c2530; --paper:#f2ede1; --orange:#e0590c;
    --green:#4c7a3d; --stamp-red:#a8362a; --amber:#c98a1f; --muted:#8b93a0; --line:#33404d;
    --display:'Oswald',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--paper); font-family:var(--body); min-height:100vh;}
  a{color:inherit;}
  .wrap{max-width:640px; margin:0 auto; padding:60px 24px 100px;}
  h1,h2{font-family:var(--display); font-weight:600; text-transform:uppercase; letter-spacing:0.01em;}
  .backlink{font-family:var(--mono); font-size:13px; color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:30px;}
  .backlink:hover{color:var(--paper);}
  .eyebrow{font-family:var(--mono); font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--orange); display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .eyebrow::before{content:""; width:22px; height:1px; background:var(--orange);}
  h1{font-size:clamp(28px,5vw,42px); margin-bottom:30px;}

  .lookup{display:flex; gap:12px; margin-bottom:40px;}
  @media (max-width:480px){.lookup{flex-direction:column;}}
  input{flex:1; padding:14px 16px; border:1px solid var(--line); border-radius:2px; background:var(--ink-soft); color:var(--paper); font-family:var(--mono); font-size:15px; letter-spacing:0.05em;}
  input:focus{outline:2px solid var(--orange); outline-offset:1px;}
  .go-btn{font-family:var(--mono); font-weight:600; font-size:14px; background:var(--orange); color:var(--ink); border:none; padding:0 26px; border-radius:2px; cursor:pointer;}

  .card{display:none; background:var(--paper); color:var(--ink); border-radius:3px; padding:36px;}
  .card .code-label{font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#6a6f76;}
  .card .code-val{font-family:var(--display); font-size:24px; margin-bottom:20px;}
  .status-badge{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px; text-transform:uppercase; letter-spacing:0.06em; padding:8px 14px; border-radius:20px; margin-bottom:24px;}
  .status-pending{background:#f3e6c9; color:#8a5c0f;}
  .status-completed{background:#e2ecdd; color:#33531f;}
  .dot{width:8px; height:8px; border-radius:50%; background:currentColor;}
  .detail-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #ddd4b9; font-size:14.5px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row span:first-child{color:#6a6f76; font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:0.05em;}
  .items-block{margin-top:18px; padding-top:18px; border-top:2px solid var(--ink);}
  .items-block .label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#6a6f76; margin-bottom:10px;}
  .items-block pre{font-family:var(--body); font-size:14px; white-space:pre-wrap; line-height:1.7;}

  .msg{display:none; font-family:var(--mono); font-size:13.5px; padding:16px 18px; border-radius:2px; margin-bottom:20px;}
  .msg.error{background:#3a2420; border:1px solid var(--stamp-red); color:#e8bcb4;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="stocklist.html">← Back to Stocklist</a>
  <div class="eyebrow">Track order</div>
  <h1>Where's my order?</h1>

  <div class="lookup">
    <input type="text" id="codeInput" placeholder="e.g. SL-4K7QX2">
    <button class="go-btn" id="lookupBtn">Track →</button>
  </div>

  <div class="msg error" id="errorMsg"></div>

  <div class="card" id="card">
    <div class="code-label">Tracking code</div>
    <div class="code-val" id="cCode"></div>
    <div class="status-badge" id="statusBadge"><span class="dot"></span><span id="statusText"></span></div>
    <div class="detail-row"><span>Business</span><span id="cBiz"></span></div>
    <div class="detail-row"><span>Type</span><span id="cType"></span></div>
    <div class="detail-row"><span>City</span><span id="cCity"></span></div>
    <div class="detail-row"><span>Placed</span><span id="cDate"></span></div>
    <div class="items-block">
      <div class="label">Items</div>
      <pre id="cItems"></pre>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://edmlbvaoxngyryuwkirq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_vzdFDXM-79Jylf-pZH1GDA_abjMIgl0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const codeInput = document.getElementById('codeInput');
  const lookupBtn = document.getElementById('lookupBtn');
  const card = document.getElementById('card');
  const errorMsg = document.getElementById('errorMsg');

  async function lookup(code){
    errorMsg.style.display = 'none';
    card.style.display = 'none';
    if(!code) return;

    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .eq('tracking_code', code.trim().toUpperCase())
      .maybeSingle();

    if(error || !data){
      errorMsg.textContent = "No order found with that tracking code. Double-check it and try again.";
      errorMsg.style.display = 'block';
      return;
    }

    document.getElementById('cCode').textContent = data.tracking_code;
    document.getElementById('cBiz').textContent = data.business_name;
    document.getElementById('cType').textContent = data.business_type || '—';
    document.getElementById('cCity').textContent = data.city || '—';
    document.getElementById('cDate').textContent = new Date(data.created_at).toLocaleString();
    document.getElementById('cItems').textContent = data.items;

    const badge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    if(data.status === 'completed'){
      badge.className = 'status-badge status-completed';
      statusText.textContent = 'Completed';
    } else {
      badge.className = 'status-badge status-pending';
      statusText.textContent = 'Pending';
    }
    card.style.display = 'block';
  }

  lookupBtn.addEventListener('click', () => lookup(codeInput.value));
  codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') lookup(codeInput.value); });

  // auto-lookup if ?code= is in the URL
  const params = new URLSearchParams(window.location.search);
  const preCode = params.get('code');
  if(preCode){ codeInput.value = preCode; lookup(preCode); }
</script>
</body>
</html>
