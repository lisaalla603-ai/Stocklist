<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track order — Stocklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-inner">
    <a href="index.html" class="brand"><span class="dot"></span>Stocklist</a>
    <div class="nav" id="topbar-nav"></div>
  </div>
</div>

<div class="wrap page-head">
  <div class="crumbs"><a href="index.html">Stocklist</a> / Track order</div>
  <h1>Track your order.</h1>
</div>

<div class="wrap">
  <section style="max-width:640px;">
    <div id="track-content"></div>

    <div class="panel" style="margin-top:20px;" id="lookup-panel">
      <div class="panel-head"><span class="panel-title">Look up a different order</span></div>
      <div class="field-row" style="align-items:end;">
        <div class="field" style="margin-bottom:0;">
          <label for="order-id-input">Order ID</label>
          <input id="order-id-input" placeholder="ord_...">
        </div>
        <button class="btn" id="lookup-btn">Track →</button>
      </div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap"><span class="stencil">Stocklist</span></div>
</footer>

<script src="assets/db.js"></script>
<script src="assets/nav.js"></script>
<script>
  const STATUS_FLOW = StocklistDB.STATUS_FLOW;
  const statusLabel = { placed: "Order placed", confirmed: "Confirmed by supplier", packed: "Packed", out_for_delivery: "Out for delivery", delivered: "Delivered" };

  function renderOrder(orderId) {
    const content = document.getElementById("track-content");
    const order = StocklistDB.getOrder(orderId);
    if (!order) {
      content.innerHTML = `<div class="empty-state"><span class="stencil">Order not found</span>Check the order ID and try again.</div>`;
      return;
    }
    const supplier = StocklistDB.getSupplier(order.supplierId);
    const currentIdx = STATUS_FLOW.indexOf(order.status);

    content.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">${supplier.name}</span>
          <span class="stencil">ORDER ${order.id.toUpperCase()}</span>
        </div>
        <p style="margin-bottom:18px;">Placed ${new Date(order.createdAt).toLocaleDateString("en-ZA", { day: "2-digit", month: "long", year: "numeric" })} · R${order.total.toFixed(2)}${order.recurrence.enabled ? " · repeats every " + order.recurrence.intervalDays + " days" : ""}</p>
        <div class="timeline">
          ${STATUS_FLOW.map((s, i) => `
            <div class="t-step ${i < currentIdx ? "done" : ""} ${i === currentIdx ? "current" : ""}">
              <div class="t-rail"><div class="t-dot"></div>${i < STATUS_FLOW.length - 1 ? '<div class="t-bar"></div>' : ""}</div>
              <div style="padding-bottom:6px;">
                <div class="t-label">${statusLabel[s]}</div>
                ${i === currentIdx ? '<div class="t-time">Current status</div>' : ""}
              </div>
            </div>
          `).join("")}
        </div>
        <hr class="divider">
        <div id="order-items"></div>
      </div>
    `;
    document.getElementById("order-items").innerHTML = order.items.map((li) =>
      `<div class="line-item"><div><div class="name">${li.name}</div><div class="meta">${li.unit} · ×${li.qty}</div></div><div>R${(li.price * li.qty).toFixed(2)}</div></div>`
    ).join("");
  }

  const params = new URLSearchParams(window.location.search);
  const orderIdParam = params.get("order");
  if (orderIdParam) {
    renderOrder(orderIdParam);
  } else {
    document.getElementById("track-content").innerHTML = `<div class="empty-state"><span class="stencil">No order selected</span>Enter an order ID below, or view your <a href="dashboard.html" style="color:var(--amber);">dashboard</a> for order links.</div>`;
  }

  document.getElementById("lookup-btn").addEventListener("click", () => {
    const id = document.getElementById("order-id-input").value.trim();
    if (id) window.location.href = "track.html?order=" + encodeURIComponent(id);
  });
</script>
</body>
</html>
